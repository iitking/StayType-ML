version: "3.8"

services:
  staytype-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staytype-ml-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
